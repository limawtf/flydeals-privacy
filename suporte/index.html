<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Suporte – FlyDeals</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #ECE8E0;
      color: #1C1C1C;
      min-height: 100vh;
    }
    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 48px 24px 64px;
    }
    .logo {
      font-size: 15px;
      font-weight: 600;
      color: #D9B77F;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-bottom: 40px;
    }
    h1 {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 32px;
      font-weight: normal;
      color: #1C1C1C;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 14px;
      font-weight: 300;
      color: #9C948D;
      margin-bottom: 40px;
      line-height: 1.6;
    }
    .card {
      background: #FFFFFF;
      border-radius: 14px;
      padding: 28px;
      box-shadow: 0 2px 12px rgba(28, 20, 16, 0.06);
      margin-bottom: 16px;
    }
    .card h2 {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #B0A89F;
      margin-bottom: 10px;
    }
    .card a {
      font-size: 16px;
      font-weight: 500;
      color: #D9B77F;
      text-decoration: none;
    }
    .card p {
      font-size: 13px;
      font-weight: 300;
      color: #9C948D;
      margin-top: 6px;
      line-height: 1.6;
    }
    .footer {
      margin-top: 40px;
      text-align: center;
      font-size: 12px;
      font-weight: 300;
      color: #B0A89F;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">FlyDeals</div>

    <h1>Suporte</h1>
    <p class="subtitle">Estamos aqui para ajudar. Entre em contato pelo canal abaixo.</p>

    <div class="card">
      <h2>E-mail</h2>
      <a href="mailto:suporte@flydeals.app">suporte@flydeals.app</a>
      <p>Respondemos em até 48 horas úteis.</p>
    </div>

    <div class="card">
      <h2>Privacidade e Dados</h2>
      <a href="mailto:privacidade@flydeals.app">privacidade@flydeals.app</a>
      <p>Para solicitações relacionadas aos seus dados pessoais (LGPD).</p>
    </div>

    <div class="footer">FlyDeals · Voo4U Turismo LTDA</div>
  </div>
</body>
</html>
